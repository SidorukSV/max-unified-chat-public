services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
        BACKEND_VERSION: ${BACKEND_VERSION:-1.0.0}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis:6379
      ONEC_CONFIG_FILE: /app/onec-config.yml
      BACKEND_LOG_FILE: /app/logs/backend.log
      BACKEND_LOG_LEVEL: ${BACKEND_LOG_LEVEL:-info}
    depends_on:
      - redis
    volumes:
      - ./logs:/app/logs
      - type: bind
        source: ./backend/onec-config.yml
        target: /app/onec-config.yml
        read_only: true
        bind:
          create_host_path: false

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro

volumes:
  redis-data:
